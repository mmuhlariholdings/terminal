# Firmware: host tests and cross-compile for both targets (keyboard board and bench Pico), on every change to the firmware.
name: Firmware

on:
  pull_request:
    paths: ["firmware/**", ".github/workflows/firmware.yml"]
  push:
    branches: [main]
    paths: ["firmware/**", ".github/workflows/firmware.yml"]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Host tests
        run: |
          cmake -S firmware/keyboard-board/test -B build/tests
          cmake --build build/tests
          cd build/tests && ctest --output-on-failure

  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [keyboard-board, bench]
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: sudo apt-get update && sudo apt-get install -y gcc-arm-none-eabi libnewlib-arm-none-eabi cmake ninja-build python3
      - name: Pico SDK
        run: |
          git clone --depth 1 --branch 2.1.1 https://github.com/raspberrypi/pico-sdk.git "$RUNNER_TEMP/pico-sdk"
          git -C "$RUNNER_TEMP/pico-sdk" submodule update --init --depth 1 lib/tinyusb
      - name: Build ${{ matrix.target }}
        run: |
          cmake -S firmware/keyboard-board -B build/${{ matrix.target }} -G Ninja \
            -DPICO_SDK_PATH="$RUNNER_TEMP/pico-sdk" -DTERMINAL_BOARD=${{ matrix.target }}
          cmake --build build/${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: terminal-${{ matrix.target }}-firmware
          path: build/${{ matrix.target }}/*.uf2
