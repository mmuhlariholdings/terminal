name: Website

# Publishes website/public to GitHub Pages.
# One-time setup: Settings → Pages → Build and deployment → Source: "GitHub Actions".

on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - ".github/workflows/website.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Report 3D model status
        run: |
          if [ -f website/public/assets/models/terminal-1.glb ]; then
            size=$(stat -c%s website/public/assets/models/terminal-1.glb)
            echo "Publishing terminal-1.glb ($size bytes)"
          else
            echo "No terminal-1.glb yet; the 3D section will show the poster image."
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: website/public

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
