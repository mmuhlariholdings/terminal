# foot terminal for Terminal 1: 720 x 720 screen.
# Terminus at 16 px has 8 x 16 pixel cells, so 720 / 8 = 90 columns and
# 720 / 16 = 45 rows (44 for the shell plus 1 for the tmux status line).
# Installed to /etc/xdg/foot/foot.ini; a user can override with ~/.config/foot/foot.ini.

[main]
# Bitmap Terminus (fonts-terminus-otb) first; DejaVu Sans Mono for glyphs Terminus lacks.
font=Terminus:pixelsize=16, DejaVu Sans Mono:pixelsize=13
# Pixel sizes above are exact; do not rescale by the panel's DPI.
dpi-aware=no
pad=0x0
# The session starts tmux; tmux sets TERM=tmux-256color inside.
shell=/usr/local/bin/terminal-1-session
# Widely known TERM so programs started outside tmux (and SSH) behave.
term=xterm-256color

[bell]
urgent=no
notify=no

[scrollback]
# tmux keeps its own scrollback; keep foot's small.
lines=1000

[cursor]
style=block
blink=no

[mouse]
hide-when-typing=yes

[colors]
# High contrast for a small screen in daylight.
foreground=e6e6e6
background=000000
