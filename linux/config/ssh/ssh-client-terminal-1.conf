# /etc/ssh/ssh_config.d/terminal-1.conf
# Add a key to the agent the first time it is used, so its passphrase is typed once
# per session. The agent started by zsh drops keys after 4 hours (ssh-agent -t 4h).
Host *
    AddKeysToAgent yes
    ServerAliveInterval 30
    ServerAliveCountMax 4
    HashKnownHosts yes
