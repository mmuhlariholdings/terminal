# /etc/systemd/logind.conf.d/terminal-1-power-key.conf
# The keyboard board sends KEY_POWER (HID System Power Down) on a long press of the
# power button, and gpio-shutdown on GPIO17 sends KEY_POWER too. Either way: clean poweroff.
# The CM4 has no real suspend, so suspend and hibernate keys do nothing.
[Login]
HandlePowerKey=poweroff
HandlePowerKeyLongPress=poweroff
HandleSuspendKey=ignore
HandleHibernateKey=ignore
HandleLidSwitch=ignore
IdleAction=ignore
PowerKeyIgnoreInhibited=yes
