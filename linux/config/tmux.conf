# tmux for Terminal 1 (installed to /etc/tmux.conf; ~/.tmux.conf is read after it).
# 90 x 45 cells: one status line at the bottom, no clutter.

set -g default-terminal "tmux-256color"
# If an old remote host complains about tmux-256color, use "screen-256color" instead.
set -g default-shell /usr/bin/zsh
set -g history-limit 20000
set -g escape-time 10
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g mouse on
set -g set-titles off
setw -g mode-keys vi
set -g focus-events on

# Status line: windows on the left; battery and Wi-Fi from terminal-1-statusd and
# the time on the right. The daemon rewrites /run/terminal-1/status.tmux.
set -g status on
set -g status-position bottom
set -g status-interval 10
set -g status-style "bg=colour236,fg=colour250"
set -g status-left "#[bold]#S#[nobold] "
set -g status-left-length 12
set -g status-right "#(cat /run/terminal-1/status.tmux 2>/dev/null || echo 'kbd --') | %H:%M "
set -g status-right-length 50
setw -g window-status-current-style "bg=colour31,fg=colour255,bold"
setw -g window-status-format " #I:#W "
setw -g window-status-current-format " #I:#W "

# Screen lock: after 5 minutes idle tmux runs vlock, which asks for the user's password.
# Lock by hand with prefix + L (Ctrl-b then Shift-l).
set -g lock-after-time 300
set -g lock-command "vlock"
bind L lock-client

# Splits that are easy to type on a BlackBerry keyboard (no | or - needed).
bind v split-window -h -c "#{pane_current_path}"
bind s split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
bind r source-file /etc/tmux.conf \; display-message "tmux.conf reloaded"
# prefix + s used to list sessions; prefix + w (choose-tree) still lists sessions and windows.
