<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Not found — Terminal 1</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#000000">
  <meta name="color-scheme" content="dark">
  <!-- GitHub Pages serves this file for any missing path, so asset URLs must not be relative.
       This page is self-contained; the only link home is resolved by the script below. -->
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='15' fill='%230b0b0c'/%3E%3Cpath d='M17 22l11 10-11 10' fill='none' stroke='%235be49b' stroke-width='5.5' stroke-linecap='round' stroke-linejoin='round'/%3E%3Crect x='32' y='39' width='16' height='5.5' rx='2.75' fill='%23f5f5f7'/%3E%3C/svg%3E">
  <style>
    :root { --bg: #000; --text: #f5f5f7; --muted: #a1a1a6; --accent: #5be49b; --blue: #7cc4ff;
      --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body { background: var(--bg); color: var(--text); font-family: var(--font); -webkit-font-smoothing: antialiased;
      display: grid; place-items: center; min-height: 100vh; padding: 48px 16px; text-align: center; }
    .line { font-family: var(--mono); font-size: clamp(14px, 2.4vw, 18px); color: var(--muted); margin: 0 0 28px; }
    .line b { color: var(--accent); font-weight: 400; }
    .cursor { display: inline-block; width: 0.6em; height: 1.1em; vertical-align: -0.2em; background: var(--accent); animation: blink 1.05s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    h1 { font-size: clamp(44px, 9vw, 96px); letter-spacing: -0.045em; line-height: 1; margin: 0 0 18px;
      background: linear-gradient(180deg, #fff 20%, #9a9aa0 120%); -webkit-background-clip: text; background-clip: text; color: transparent; }
    p { color: var(--muted); font-size: clamp(18px, 2vw, 21px); margin: 0 auto; max-width: 30ch; line-height: 1.45; }
    a.btn { display: inline-flex; align-items: center; min-height: 46px; margin-top: 36px; padding: 12px 24px; border-radius: 999px;
      background: var(--text); color: #000; text-decoration: none; font-weight: 500; font-size: 17px; }
    a.btn:hover { background: #fff; }
    a:focus-visible { outline: 2px solid var(--blue); outline-offset: 3px; }
    @media (prefers-reduced-motion: reduce) { .cursor { animation: none; } }
  </style>
</head>
<body>
  <main>
    <p class="line" aria-hidden="true"><b>t1 ~ ❯</b> cd <span id="path">/missing</span><br>cd: no such file or directory <span class="cursor"></span></p>
    <h1>Not found.</h1>
    <p>That page isn’t here. The rest of Terminal 1 is.</p>
    <a class="btn" id="home" href="/">Back to Terminal 1</a>
  </main>
  <script>
    (function () {
      // Works both at a project-pages path (/terminal-1/...) and at a domain root.
      var first = location.pathname.split('/')[1];
      var base = location.hostname.endsWith('github.io') && first ? '/' + first + '/' : '/';
      document.getElementById('home').href = base;
      var p = location.pathname.length > 40 ? location.pathname.slice(0, 40) + '…' : location.pathname;
      document.getElementById('path').textContent = p;
    })();
  </script>
</body>
</html>
